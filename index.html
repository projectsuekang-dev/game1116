<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>미니 아케이드</title>
<style>
  html,body{margin:0;height:100%;background:#05070f;overflow:hidden;font-family:"Segoe UI","Malgun Gothic",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#0a1028;box-shadow:0 0 40px #1a3a8a55;max-width:100vw;max-height:100vh}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="480" height="720"></canvas></div>
<script>
(() => {
// =====================================================================
//  공통
// =====================================================================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const FONT = '"Segoe UI","Malgun Gothic",sans-serif';

function fit(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); fit();

const rnd = (a,b) => Math.random()*(b-a)+a;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const dist2 = (a,b) => (a.x-b.x)**2 + (a.y-b.y)**2;
const inRect = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
function store(k, v){ try { if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } }
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function text(str, x, y, size, color, align='center', weight='bold'){
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(str, x, y);
}

// ---------- 소리 ----------
let actx = null;
function unlockAudio(){ if(!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } else if(actx.state === 'suspended') actx.resume(); }
function beep(freq, dur, type='square', vol=0.05, slide=0){
  if(!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), actx.currentTime + dur);
  g.gain.value = vol;
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}
function noise(dur, vol=0.15){
  if(!actx) return;
  const len = actx.sampleRate * dur, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  const s = actx.createBufferSource(), g = actx.createGain();
  s.buffer = buf; g.gain.value = vol; s.connect(g); g.connect(actx.destination); s.start();
}
const sfx = {
  shoot(){ beep(880, .06, 'square', .02, -400); },
  hit(){ beep(220, .05, 'square', .03); },
  boom(){ noise(.35, .18); beep(120, .3, 'sawtooth', .05, -80); },
  big(){ noise(.9, .3); beep(80, .8, 'sawtooth', .08, -50); },
  power(){ beep(520,.08,'triangle',.06); setTimeout(()=>beep(780,.08,'triangle',.06),80); setTimeout(()=>beep(1040,.12,'triangle',.06),160); },
  hurt(){ beep(300,.4,'sawtooth',.08,-250); noise(.3,.15); },
  bounce(){ beep(440, .05, 'triangle', .06); },
  brick(p=1){ beep(600 + p*120, .07, 'square', .04); },
  jump(){ beep(300, .15, 'triangle', .06, 400); },
  coin(){ beep(990,.05,'square',.04); setTimeout(()=>beep(1320,.08,'square',.04),50); },
  select(){ beep(660, .06, 'triangle', .05); },
};

// 공통 파티클 헬퍼
function burst(list, x, y, n, color, spd=4, life=40){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = Math.random()*spd;
    list.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: rnd(life*.5, life), max: life, color, size: rnd(1.5,3.5) });
  }
}
function stepParts(list, grav=0){
  for(const p of list){ p.x += p.vx; p.y += p.vy; p.vx *= .96; p.vy = p.vy*.96 + grav; p.life--; }
  return list.filter(p => p.life > 0);
}
function drawParts(list){
  for(const p of list){ ctx.globalAlpha = Math.max(0, p.life/p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); }
  ctx.globalAlpha = 1;
}

// 공용 입력 상태
const keys = {};
let frame = 0;

// 게임이 끝났을 때 각 게임이 부름
let lastScore = 0, lastExtra = '';
function finish(score, extra){
  lastScore = score; lastExtra = extra || '';
  const k = game.bestKey, best = +(store(k) || 0);
  if(score > best) store(k, score);
  mode = 'over';
}

// =====================================================================
//  게임 1: 스카이 스트라이커 (세로 슈팅)
// =====================================================================
function makeShooter(){
  let player, bullets, eBullets, enemies, particles, items, score, frame, stage, boss, shake, flash, bannerT, bannerText, drag, lastTap = 0;
  const stars = [];
  for(let i=0;i<120;i++) stars.push({ x: Math.random()*W, y: Math.random()*H, z: Math.random()*2.5+0.5 });

  function showBanner(t){ bannerText = t; bannerT = 150; }
  function explode(x, y, n, color, spd=4){ burst(particles, x, y, n, color, spd, 45); }
  function aimAt(e, speed, spread=0){
    const a = Math.atan2(player.y - e.y, player.x - e.x) + spread;
    return { vx: Math.cos(a)*speed, vy: Math.sin(a)*speed };
  }
  function fireE(x, y, vx, vy, color='#ff5a7a', r=4){ eBullets.push({ x, y, vx, vy, r, color }); }

  const TYPES = {
    scout:  { hp: 2,  r: 14, score: 100, color: '#ff7a5a' },
    zigzag: { hp: 3,  r: 15, score: 150, color: '#ffb84d' },
    gunner: { hp: 8,  r: 20, score: 300, color: '#c46bff' },
    tank:   { hp: 22, r: 28, score: 700, color: '#5ad1a0' },
  };
  function spawnEnemy(type, x, y, opts={}){
    const t = TYPES[type];
    const hpMul = 1 + (stage-1)*0.35;
    enemies.push(Object.assign({ type, x, y, vx: 0, vy: 2, hp: Math.ceil(t.hp*hpMul), maxHp: Math.ceil(t.hp*hpMul), r: t.r, color: t.color, score: t.score, t: 0, hit: 0 }, opts));
  }
  function spawnWave(){
    const diff = Math.min(stage, 6), f = frame;
    if(f % Math.max(28, 60 - diff*5) === 0) spawnEnemy('scout', rnd(30, W-30), -20, { vy: rnd(2.2, 3.2) + diff*0.2 });
    if(f % Math.max(90, 180 - diff*12) === 0){
      const left = Math.random() < .5;
      for(let i=0;i<5;i++) spawnEnemy('zigzag', left ? 80 : W-80, -20 - i*40, { vy: 2.4, base: left ? 80 : W-80, amp: rnd(60,120) });
    }
    if(f % Math.max(150, 300 - diff*20) === 0) spawnEnemy('gunner', rnd(60, W-60), -30, { vy: 1.2, stopY: rnd(90, 220) });
    if(stage >= 2 && f % Math.max(400, 700 - diff*40) === 0) spawnEnemy('tank', rnd(80, W-80), -40, { vy: 0.7 });
  }
  function spawnBoss(){
    const hp = 400 + stage*250;
    boss = { x: W/2, y: -100, r: 55, hp, maxHp: hp, t: 0, phase: 0, hit: 0, enter: true };
    showBanner('WARNING!  BOSS'); sfx.big();
  }
  function updateEnemy(e){
    e.t++;
    switch(e.type){
      case 'scout': e.y += e.vy; break;
      case 'zigzag': e.y += e.vy; e.x = e.base + Math.sin(e.t*0.05)*e.amp; break;
      case 'gunner':
        if(e.y < e.stopY) e.y += e.vy*2;
        else { e.x += Math.sin(e.t*0.02)*1.2; if(e.t > 420) e.y += 2; }
        if(e.t % Math.max(40, 80 - stage*6) === 0 && e.y > 0)
          for(let s=-1;s<=1;s++){ const v = aimAt(e, 3.4, s*0.22); fireE(e.x, e.y+10, v.vx, v.vy); }
        break;
      case 'tank':
        e.y += e.vy;
        if(e.t % 70 === 0 && e.y > 0)
          for(let i=0;i<12;i++){ const a = i/12*Math.PI*2 + e.t*0.01; fireE(e.x, e.y, Math.cos(a)*2.4, Math.sin(a)*2.4, '#7affc8', 5); }
        break;
    }
    if(e.type === 'scout' && e.t === 40 && stage >= 2 && Math.random() < .5){ const v = aimAt(e, 3.5); fireE(e.x, e.y, v.vx, v.vy); }
  }
  function updateBoss(){
    const b = boss; b.t++;
    if(b.enter){ b.y += 1.5; if(b.y >= 130) b.enter = false; return; }
    const ratio = b.hp / b.maxHp;
    b.phase = ratio > .66 ? 0 : ratio > .33 ? 1 : 2;
    b.x = W/2 + Math.sin(b.t*0.012)*(140 + b.phase*20);
    b.y = 130 + Math.sin(b.t*0.03)*20;
    const sp = 2.6 + stage*0.2;
    if(b.phase === 0){
      if(b.t % 50 === 0) for(let s=-2;s<=2;s++){ const v = aimAt(b, sp, s*0.15); fireE(b.x, b.y+40, v.vx, v.vy, '#ffd25a', 5); }
      if(b.t % 90 === 45) for(let i=0;i<16;i++){ const a=i/16*Math.PI*2; fireE(b.x, b.y, Math.cos(a)*2.2, Math.sin(a)*2.2, '#ff6ad5', 5); }
    } else if(b.phase === 1){
      if(b.t % 6 === 0){ const a = b.t*0.13; for(let k=0;k<3;k++){ const aa=a+k*Math.PI*2/3; fireE(b.x, b.y, Math.cos(aa)*2.6, Math.sin(aa)*2.6, '#ff6ad5', 4); } }
      if(b.t % 70 === 0) for(let s=-1;s<=1;s++){ const v = aimAt(b, sp+1, s*0.1); fireE(b.x-40, b.y+30, v.vx, v.vy, '#ffd25a', 6); fireE(b.x+40, b.y+30, v.vx, v.vy, '#ffd25a', 6); }
    } else {
      if(b.t % 4 === 0){ const a = b.t*0.17; for(let k=0;k<4;k++){ const aa=a+k*Math.PI/2; fireE(b.x, b.y, Math.cos(aa)*2.8, Math.sin(aa)*2.8, '#ff4d4d', 4); } }
      if(b.t % 60 === 0) for(let i=0;i<24;i++){ const a=i/24*Math.PI*2; fireE(b.x, b.y, Math.cos(a)*1.8, Math.sin(a)*1.8, '#ffd25a', 6); }
      if(b.t % 4 === 0 && Math.random() < .5) explode(b.x+rnd(-50,50), b.y+rnd(-30,30), 3, '#ff9a3a', 2);
    }
  }
  function firePlayer(){
    const p = player, x = p.x, y = p.y - 18;
    const add = (dx, vx, dmg=1) => bullets.push({ x: x+dx, y, vx, vy: -12, dmg });
    switch(Math.min(p.power, 5)){
      case 1: add(0,0); break;
      case 2: add(-6,0); add(6,0); break;
      case 3: add(0,0); add(-10,-1.2); add(10,1.2); break;
      case 4: add(-5,0); add(5,0); add(-12,-1.6); add(12,1.6); break;
      default: add(-5,0,1.5); add(5,0,1.5); add(-12,-1.4); add(12,1.4); add(-16,-3); add(16,3); break;
    }
    sfx.shoot();
  }
  function useBomb(){
    if(player.bombs <= 0) return;
    player.bombs--;
    flash = 20; shake = 20; sfx.big();
    eBullets.length = 0;
    for(const e of enemies){ e.hp -= 30; e.hit = 6; }
    if(boss && !boss.enter){ boss.hp -= 60; boss.hit = 6; }
    for(let i=0;i<60;i++) explode(rnd(0,W), rnd(0,H), 1, '#ffffff', 6);
  }
  function hurtPlayer(){
    if(player.inv > 0 || player.shield > 0){ if(player.shield>0){ player.shield = 0; player.inv = 60; sfx.hit(); } return; }
    player.lives--; player.inv = 150; player.power = Math.max(1, player.power-1);
    explode(player.x, player.y, 40, '#7fd4ff', 5); sfx.hurt(); shake = 15;
    eBullets.length = 0;
    if(player.lives <= 0) finish(score, `도달 스테이지 ${stage}`);
  }
  function dropItem(x, y, chance){
    if(Math.random() > chance) return;
    const r = Math.random();
    const kind = r < .55 ? 'P' : r < .75 ? 'B' : r < .9 ? 'S' : 'L';
    items.push({ x, y, kind, vy: 1.5, t: 0 });
  }

  function scrollStars(){ for(const s of stars){ s.y += s.z * (boss ? 2.2 : 1.4); if(s.y > H){ s.y = 0; s.x = Math.random()*W; } } }

  function update(){
    frame++;
    scrollStars();
    const p = player;
    let dx = 0, dy = 0;
    if(keys.ArrowLeft || keys.KeyA) dx--;
    if(keys.ArrowRight || keys.KeyD) dx++;
    if(keys.ArrowUp || keys.KeyW) dy--;
    if(keys.ArrowDown || keys.KeyS) dy++;
    if(dx && dy){ dx *= .7071; dy *= .7071; }
    p.x += dx * p.speed; p.y += dy * p.speed;
    p.x = clamp(p.x, 16, W-16); p.y = clamp(p.y, 20, H-20);
    p.tilt = dx;
    if(p.inv > 0) p.inv--;
    if(p.cd > 0) p.cd--;
    if((keys.Space || drag) && p.cd <= 0){ firePlayer(); p.cd = 7; }

    if(!boss){ spawnWave(); if(frame >= 2400) spawnBoss(); }
    else updateBoss();

    for(const b of bullets){ b.x += b.vx; b.y += b.vy; }
    bullets = bullets.filter(b => b.y > -20 && b.x > -20 && b.x < W+20 && !b.dead);
    for(const b of eBullets){ b.x += b.vx; b.y += b.vy; }
    eBullets = eBullets.filter(b => b.y > -20 && b.y < H+20 && b.x > -20 && b.x < W+20);
    for(const e of enemies){ updateEnemy(e); if(e.hit>0) e.hit--; }
    if(boss && boss.hit > 0) boss.hit--;

    for(const b of bullets){
      for(const e of enemies){
        if(e.hp > 0 && dist2(b, e) < (e.r+4)**2){ e.hp -= b.dmg; e.hit = 4; b.dead = true; explode(b.x, b.y, 2, '#ffe9a0', 2); break; }
      }
      if(!b.dead && boss && !boss.enter && dist2(b, boss) < boss.r**2){ boss.hp -= b.dmg; boss.hit = 3; b.dead = true; explode(b.x, b.y, 2, '#ffe9a0', 2); if(frame%4===0) sfx.hit(); }
    }
    for(const e of enemies){
      if(e.hp <= 0 && !e.dead){
        e.dead = true; score += e.score * stage;
        explode(e.x, e.y, e.r*1.5, e.color, 4); sfx.boom(); shake = Math.max(shake, e.type==='tank'?10:4);
        dropItem(e.x, e.y, e.type === 'tank' ? 1 : e.type === 'gunner' ? .35 : .06);
      }
    }
    enemies = enemies.filter(e => !e.dead && e.y < H+60);

    if(boss && boss.hp <= 0){
      score += 10000 * stage;
      explode(boss.x, boss.y, 150, '#ffb84d', 8); explode(boss.x, boss.y, 80, '#ffffff', 5);
      for(let i=0;i<4;i++) items.push({ x: boss.x + rnd(-40,40), y: boss.y, kind: i===0?'L':'P', vy: 1.5, t: 0 });
      sfx.big(); flash = 25; shake = 30;
      boss = null; eBullets.length = 0;
      stage++; frame = 0;
      showBanner(`STAGE ${stage}`);
    }

    if(p.inv <= 0 && p.lives > 0){
      for(const b of eBullets){ if(dist2(b, p) < (b.r + 4)**2){ hurtPlayer(); break; } }
      for(const e of enemies){ if(dist2(e, p) < (e.r + 8)**2){ e.hp -= 10; hurtPlayer(); break; } }
      if(boss && dist2(boss, p) < (boss.r + 8)**2) hurtPlayer();
    }

    for(const it of items){
      it.t++; it.y += it.vy; it.x += Math.sin(it.t*0.05)*0.8;
      if(dist2(it, p) < 30*30){
        it.dead = true; sfx.power(); score += 500;
        if(it.kind === 'P'){ if(p.power < 5) p.power++; else score += 2000; }
        if(it.kind === 'B') p.bombs = Math.min(5, p.bombs+1);
        if(it.kind === 'S') p.shield = 1;
        if(it.kind === 'L') p.lives = Math.min(5, p.lives+1);
      }
    }
    items = items.filter(i => !i.dead && i.y < H+20);
    particles = stepParts(particles);
    if(shake > 0) shake--;
    if(flash > 0) flash--;
    if(bannerT > 0) bannerT--;
  }

  function drawPlayer(){
    const p = player;
    if(p.inv > 0 && Math.floor(p.inv/5)%2) return;
    ctx.save(); ctx.translate(p.x, p.y);
    const fl = 8 + Math.random()*8;
    ctx.fillStyle = '#ffb347';
    ctx.beginPath(); ctx.moveTo(-5,14); ctx.lineTo(0,14+fl); ctx.lineTo(5,14); ctx.fill();
    ctx.fillStyle = '#fff3c4';
    ctx.beginPath(); ctx.moveTo(-2.5,14); ctx.lineTo(0,14+fl*.6); ctx.lineTo(2.5,14); ctx.fill();
    ctx.scale(1 - Math.abs(p.tilt||0)*0.15, 1);
    drawPlane();
    ctx.restore();
    if(p.shield){
      ctx.strokeStyle = `rgba(120,220,255,${.5+Math.sin(frame*.2)*.3})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, 28, 0, Math.PI*2); ctx.stroke();
    }
  }
  function drawEnemy(e){
    ctx.save(); ctx.translate(e.x, e.y);
    const c = e.hit ? '#ffffff' : e.color;
    ctx.fillStyle = c;
    if(e.type === 'scout'){
      ctx.beginPath(); ctx.moveTo(0,14); ctx.lineTo(-14,-8); ctx.lineTo(-4,-4); ctx.lineTo(0,-12); ctx.lineTo(4,-4); ctx.lineTo(14,-8); ctx.closePath(); ctx.fill();
    } else if(e.type === 'zigzag'){
      ctx.rotate(e.t*0.1);
      ctx.beginPath(); for(let i=0;i<6;i++){ const a=i/6*Math.PI*2; const r=i%2?7:15; ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);} ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#331a00'; ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fill();
    } else if(e.type === 'gunner'){
      ctx.beginPath(); ctx.moveTo(0,20); ctx.lineTo(-20,0); ctx.lineTo(-16,-14); ctx.lineTo(16,-14); ctx.lineTo(20,0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = e.hit ? '#fff' : '#3a1060'; ctx.fillRect(-4,4,8,14);
      ctx.fillStyle = '#ff5a7a'; ctx.beginPath(); ctx.arc(0,-3,4,0,Math.PI*2); ctx.fill();
    } else if(e.type === 'tank'){
      ctx.beginPath(); ctx.arc(0,0,28,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = e.hit ? '#fff' : '#1f5a44';
      ctx.beginPath(); ctx.arc(0,0,18,0,Math.PI*2); ctx.fill();
      ctx.rotate(e.t*0.03); ctx.fillStyle = '#7affc8';
      for(let i=0;i<4;i++){ ctx.rotate(Math.PI/2); ctx.fillRect(-3,16,6,14); }
    }
    ctx.restore();
    if(e.maxHp >= 8 && e.hp < e.maxHp){
      ctx.fillStyle = '#0008'; ctx.fillRect(e.x-e.r, e.y-e.r-8, e.r*2, 3);
      ctx.fillStyle = '#5aff7a'; ctx.fillRect(e.x-e.r, e.y-e.r-8, e.r*2*Math.max(0,e.hp/e.maxHp), 3);
    }
  }
  function drawBoss(){
    const b = boss;
    ctx.save(); ctx.translate(b.x, b.y);
    const base = b.hit ? '#ffffff' : ['#8a4dff','#ff4dae','#ff4d4d'][b.phase];
    ctx.fillStyle = b.hit ? '#fff' : '#3b2a6b';
    ctx.beginPath(); ctx.moveTo(-90,-10); ctx.lineTo(-30,-30); ctx.lineTo(-20,30); ctx.lineTo(-70,25); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(90,-10); ctx.lineTo(30,-30); ctx.lineTo(20,30); ctx.lineTo(70,25); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd25a'; ctx.fillRect(-45,20,10,16); ctx.fillRect(35,20,10,16);
    ctx.fillStyle = base;
    ctx.beginPath(); ctx.moveTo(0,55); ctx.lineTo(-40,20); ctx.lineTo(-35,-40); ctx.lineTo(35,-40); ctx.lineTo(40,20); ctx.closePath(); ctx.fill();
    const pulse = 10 + Math.sin(b.t*0.15)*3;
    const g = ctx.createRadialGradient(0,0,2,0,0,pulse+6); g.addColorStop(0,'#fff'); g.addColorStop(.4,'#ffe066'); g.addColorStop(1,'rgba(255,100,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,pulse+6,0,Math.PI*2); ctx.fill();
    ctx.restore();
    const w = W - 60;
    ctx.fillStyle = '#000a'; ctx.fillRect(30, 50, w, 8);
    ctx.fillStyle = ['#8a4dff','#ff4dae','#ff4d4d'][b.phase]; ctx.fillRect(30, 50, w * Math.max(0, b.hp/b.maxHp), 8);
    ctx.strokeStyle = '#fff6'; ctx.lineWidth = 1; ctx.strokeRect(30, 50, w, 8);
  }
  function drawItem(it){
    const colors = { P: '#ff5a5a', B: '#ffb84d', S: '#5ad6ff', L: '#5aff7a' };
    ctx.save(); ctx.translate(it.x, it.y);
    ctx.shadowColor = colors[it.kind]; ctx.shadowBlur = 12;
    ctx.fillStyle = colors[it.kind];
    ctx.beginPath(); ctx.arc(0,0,11,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    text(it.kind, 0, 1, 13, '#111');
    ctx.restore();
  }
  function drawHUD(){
    text(`SCORE ${score}`, 12, 22, 18, '#fff', 'left');
    text(`STAGE ${stage}`, W-12, 22, 18, '#fff', 'right');
    for(let i=0;i<player.lives;i++){ ctx.fillStyle = '#7fd4ff'; ctx.beginPath(); const x=16+i*20, y=H-20; ctx.moveTo(x,y-8); ctx.lineTo(x-7,y+6); ctx.lineTo(x+7,y+6); ctx.closePath(); ctx.fill(); }
    for(let i=0;i<player.bombs;i++){ ctx.fillStyle = '#ffb84d'; ctx.beginPath(); ctx.arc(W-18-i*20, H-18, 7, 0, Math.PI*2); ctx.fill(); text('B', W-18-i*20, H-17, 9, '#000'); }
    text('POWER ' + '■'.repeat(player.power) + '□'.repeat(5-player.power), 12, 42, 12, '#ff9a9a', 'left', 'normal');
  }

  return {
    name: '스카이 스트라이커', en: 'SKY STRIKER', color: '#7fd4ff', bestKey: 'skystriker_best',
    desc: '세로 슈팅 · 탄막을 피하고 보스를 격추!',
    help: ['이동: 방향키 / WASD', '사격: 스페이스 (누르고 있으면 연사)', '폭탄: B 또는 Shift', '모바일: 드래그로 이동 + 자동 사격, 두 번 탭 = 폭탄'],
    start(){
      player = { x: W/2, y: H-90, r: 10, speed: 5, cd: 0, power: 1, lives: 3, bombs: 3, inv: 120, shield: 0 };
      bullets = []; eBullets = []; enemies = []; particles = []; items = [];
      score = 0; frame = 0; stage = 1; boss = null; shake = 0; flash = 0; drag = null;
      showBanner('STAGE 1');
    },
    update, idle(){ scrollStars(); particles = stepParts(particles); },
    keydown(code){ if(code === 'KeyB' || code === 'ShiftLeft' || code === 'ShiftRight') useBomb(); },
    pdown(p, n){
      const now = performance.now();
      if(n >= 2 || now - lastTap < 280) useBomb();
      lastTap = now;
      drag = { sx: p.x, sy: p.y, px: player.x, py: player.y };
    },
    pmove(p){
      if(!drag) return;
      player.x = clamp(drag.px + (p.x - drag.sx) * 1.3, 16, W-16);
      player.y = clamp(drag.py + (p.y - drag.sy) * 1.3, 20, H-20);
    },
    pup(n){ if(n === 0) drag = null; },
    draw(){
      ctx.save();
      if(shake > 0) ctx.translate(rnd(-shake,shake)*.4, rnd(-shake,shake)*.4);
      const bg = ctx.createLinearGradient(0,0,0,H);
      bg.addColorStop(0, boss ? '#1a0820' : '#071030'); bg.addColorStop(1, '#0a1a3a');
      ctx.fillStyle = bg; ctx.fillRect(-20,-20,W+40,H+40);
      for(const s of stars){ ctx.fillStyle = `rgba(200,220,255,${s.z/3})`; ctx.fillRect(s.x, s.y, s.z*.8, s.z*(boss?3:1.6)); }
      for(const it of items) drawItem(it);
      for(const e of enemies) drawEnemy(e);
      if(boss) drawBoss();
      ctx.fillStyle = '#ffe066';
      for(const b of bullets) ctx.fillRect(b.x-2, b.y-8, 4, 14);
      ctx.fillStyle = '#fff'; for(const b of bullets) ctx.fillRect(b.x-1, b.y-6, 2, 8);
      if(player.lives > 0) drawPlayer();
      for(const b of eBullets){
        ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r*.45, 0, Math.PI*2); ctx.fill();
      }
      drawParts(particles);
      ctx.restore();
      drawHUD();
      if(flash > 0){ ctx.fillStyle = `rgba(255,255,255,${flash/30})`; ctx.fillRect(0,0,W,H); }
      if(bannerT > 0 && mode === 'play'){
        ctx.globalAlpha = Math.min(1, bannerT/30);
        text(bannerText, W/2, H/2 - 60, 40, bannerText.startsWith('WARNING') ? '#ff5a5a' : '#7fd4ff');
        ctx.globalAlpha = 1;
      }
    },
  };
}

// 슈팅 게임과 메뉴 아이콘이 같이 쓰는 비행기 그림 (원점 중심)
function drawPlane(){
  ctx.fillStyle = '#2d6cdf';
  ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(-22,10); ctx.lineTo(-20,15); ctx.lineTo(0,8); ctx.lineTo(20,15); ctx.lineTo(22,10); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0,8); ctx.lineTo(-9,17); ctx.lineTo(9,17); ctx.closePath(); ctx.fill();
  const g = ctx.createLinearGradient(-6,0,6,0); g.addColorStop(0,'#9fc4ff'); g.addColorStop(.5,'#ffffff'); g.addColorStop(1,'#9fc4ff');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(0,-22); ctx.quadraticCurveTo(7,-8,6,14); ctx.lineTo(-6,14); ctx.quadraticCurveTo(-7,-8,0,-22); ctx.fill();
  ctx.fillStyle = '#1ec8ff';
  ctx.beginPath(); ctx.ellipse(0,-8,3,6,0,0,Math.PI*2); ctx.fill();
}

// =====================================================================
//  게임 2: 네온 브레이커 (블록 깨기)
// =====================================================================
function makeBreaker(){
  const COLS = 8, BW = (W - 40) / COLS, BH = 22, TOP = 100, CEIL = 56;
  const ROWCOL = ['#ff5a5a','#ffb84d','#ffe066','#5aff7a','#4dd9ff','#7a8cff','#c46bff','#ff6ad5'];
  const ITEMCOL = { E: '#4dd9ff', M: '#ffe066', T: '#ff6a3d', L: '#5aff7a' };
  let paddle, balls, bricks, items, parts, score, lives, stage, bannerT, bannerText, pierceT, expandT, shake;

  function layout(n){
    const rows = Math.min(5 + n, 10), pat = (n - 1) % 5;
    bricks = [];
    for(let r=0;r<rows;r++) for(let c=0;c<COLS;c++){
      let on = true;
      if(pat === 1) on = (r + c) % 2 === 0 || r < 2;
      if(pat === 2) on = Math.abs(c - 3.5) <= r * 0.5 + 0.5;
      if(pat === 3) on = !(c === 3 || c === 4) || r % 3 === 0;
      if(pat === 4) on = r % 2 === 0 || c === 0 || c === COLS - 1;
      if(!on) continue;
      let hp = 1;
      if(n >= 2 && r < Math.min(3, Math.ceil(n / 2))) hp = 2;
      if(n >= 3 && r === 0) hp = 3;
      bricks.push({ x: 20 + c*BW + 2, y: TOP + r*(BH + 4), w: BW - 4, h: BH, hp, max: hp, color: ROWCOL[r % 8], hit: 0 });
    }
  }
  function speed(){ return Math.min(10, 5.5 + stage * 0.45); }
  function resetBall(){ balls = [{ x: paddle.x, y: paddle.y - 15, vx: 0, vy: 0, r: 7, stuck: true, trail: [] }]; }
  function launch(){
    for(const b of balls) if(b.stuck){
      const a = rnd(-0.4, 0.4), s = speed();
      b.vx = Math.sin(a) * s; b.vy = -Math.cos(a) * s; b.stuck = false;
      sfx.bounce();
    }
  }
  function showBanner(t){ bannerText = t; bannerT = 120; }
  function hitBrick(br, pierce){
    br.hp = pierce ? 0 : br.hp - 1; br.hit = 6;
    score += 10;
    sfx.brick(br.hp);
    if(br.hp <= 0){
      br.dead = true; score += 50 * br.max * stage;
      burst(parts, br.x + br.w/2, br.y + br.h/2, 18, br.max > 1 ? '#e6ecff' : br.color, 4, 35);
      if(Math.random() < 0.14){
        const r = Math.random();
        items.push({ x: br.x + br.w/2, y: br.y + br.h/2, kind: r < .35 ? 'E' : r < .65 ? 'M' : r < .9 ? 'T' : 'L' });
      }
    }
  }
  function moveBall(b){
    if(b.stuck){ b.x = paddle.x; b.y = paddle.y - paddle.h/2 - b.r - 1; return; }
    b.trail.push({ x: b.x, y: b.y }); if(b.trail.length > 7) b.trail.shift();
    const N = 4;
    for(let s=0;s<N;s++){
      b.x += b.vx / N; b.y += b.vy / N;
      if(b.x < b.r){ b.x = b.r; b.vx = Math.abs(b.vx); sfx.bounce(); }
      if(b.x > W - b.r){ b.x = W - b.r; b.vx = -Math.abs(b.vx); sfx.bounce(); }
      if(b.y < CEIL + b.r){ b.y = CEIL + b.r; b.vy = Math.abs(b.vy); sfx.bounce(); }
      // 패들
      const ptop = paddle.y - paddle.h/2;
      if(b.vy > 0 && b.y + b.r >= ptop && b.y < paddle.y + paddle.h/2 && Math.abs(b.x - paddle.x) < paddle.w/2 + b.r){
        const off = clamp((b.x - paddle.x) / (paddle.w/2), -1, 1), a = off * 1.05, sp = speed();
        b.vx = Math.sin(a) * sp; b.vy = -Math.cos(a) * sp; b.y = ptop - b.r;
        sfx.bounce();
      }
      // 벽돌
      for(const br of bricks){
        if(br.dead) continue;
        const cx = clamp(b.x, br.x, br.x + br.w), cy = clamp(b.y, br.y, br.y + br.h);
        const dx = b.x - cx, dy = b.y - cy;
        if(dx*dx + dy*dy < b.r*b.r){
          const pierce = pierceT > 0;
          hitBrick(br, pierce);
          if(!pierce){
            if(dx === 0 && dy === 0) b.vy = -b.vy;
            else if(Math.abs(dx) > Math.abs(dy)){ b.vx = Math.sign(dx) * Math.abs(b.vx); b.x = cx + Math.sign(dx) * b.r; }
            else { b.vy = Math.sign(dy) * Math.abs(b.vy); b.y = cy + Math.sign(dy) * b.r; }
            break;
          }
        }
      }
    }
    // 너무 수평으로 도는 걸 방지
    if(!b.stuck && Math.abs(b.vy) < 1.2){ b.vy = (b.vy < 0 ? -1 : 1) * 1.6; }
  }

  function update(){
    // 패들 이동
    let dx = 0;
    if(keys.ArrowLeft || keys.KeyA) dx--;
    if(keys.ArrowRight || keys.KeyD) dx++;
    paddle.x += dx * 9;
    const targetW = expandT > 0 ? 150 : 90;
    paddle.w += (targetW - paddle.w) * 0.15;
    paddle.x = clamp(paddle.x, paddle.w/2, W - paddle.w/2);
    if(expandT > 0) expandT--;
    if(pierceT > 0) pierceT--;

    for(const b of balls) moveBall(b);
    bricks = bricks.filter(b => !b.dead);
    for(const br of bricks) if(br.hit > 0) br.hit--;

    // 아이템
    for(const it of items){
      it.y += 2.6;
      if(it.y > paddle.y - paddle.h/2 - 10 && it.y < paddle.y + 12 && Math.abs(it.x - paddle.x) < paddle.w/2 + 12){
        it.dead = true; sfx.power(); score += 200;
        if(it.kind === 'E') expandT = 900;
        if(it.kind === 'T') pierceT = 480;
        if(it.kind === 'L') lives = Math.min(5, lives + 1);
        if(it.kind === 'M'){
          const add = [];
          for(const b of balls){
            if(b.stuck) continue;
            for(const da of [-0.35, 0.35]){
              const c = Math.cos(da), s = Math.sin(da);
              add.push({ x: b.x, y: b.y, vx: b.vx*c - b.vy*s, vy: b.vx*s + b.vy*c, r: b.r, stuck: false, trail: [] });
            }
          }
          balls.push(...add.slice(0, Math.max(0, 12 - balls.length)));
        }
      }
    }
    items = items.filter(it => !it.dead && it.y < H + 20);

    // 공을 놓침
    balls = balls.filter(b => b.y < H + 20);
    if(balls.length === 0){
      lives--; sfx.hurt(); shake = 12;
      expandT = 0; pierceT = 0; items = [];
      if(lives <= 0){ finish(score, `도달 스테이지 ${stage}`); return; }
      resetBall();
    }

    // 스테이지 클리어
    if(bricks.length === 0){
      score += 1000 * stage; stage++;
      sfx.power(); layout(stage); resetBall(); items = [];
      showBanner(`STAGE ${stage}`);
    }

    parts = stepParts(parts, 0.08);
    if(shake > 0) shake--;
    if(bannerT > 0) bannerT--;
  }

  function draw(){
    ctx.save();
    if(shake > 0) ctx.translate(rnd(-shake, shake)*.5, rnd(-shake, shake)*.5);
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#12051f'); bg.addColorStop(1, '#05141f');
    ctx.fillStyle = bg; ctx.fillRect(-20, -20, W+40, H+40);
    // 네온 격자
    ctx.strokeStyle = 'rgba(180,80,255,0.08)'; ctx.lineWidth = 1;
    for(let x=0;x<=W;x+=40){ ctx.beginPath(); ctx.moveTo(x, CEIL); ctx.lineTo(x, H); ctx.stroke(); }
    for(let y=CEIL + ((frame*0.5)%40);y<=H;y+=40){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.strokeStyle = '#ff6ad5'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, CEIL); ctx.lineTo(W, CEIL); ctx.stroke();

    // 벽돌
    for(const br of bricks){
      let col = br.color;
      if(br.max === 3) col = br.hp === 3 ? '#ffd24d' : br.hp === 2 ? '#e0b030' : '#a8801c';
      else if(br.max === 2) col = br.hp === 2 ? '#c8d4ec' : '#8f9bb5';
      if(br.hit) col = '#ffffff';
      ctx.shadowColor = col; ctx.shadowBlur = 10;
      ctx.fillStyle = col; rr(br.x, br.y, br.w, br.h, 4); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(br.x + 3, br.y + 3, br.w - 6, 4);
      if(br.max > 1 && br.hp < br.max){ // 금 간 표시
        ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 1.5; ctx.beginPath();
        ctx.moveTo(br.x + br.w*.3, br.y); ctx.lineTo(br.x + br.w*.45, br.y + br.h*.5); ctx.lineTo(br.x + br.w*.35, br.y + br.h); ctx.stroke();
      }
    }
    // 아이템
    for(const it of items){
      ctx.shadowColor = ITEMCOL[it.kind]; ctx.shadowBlur = 12;
      ctx.fillStyle = ITEMCOL[it.kind]; rr(it.x - 16, it.y - 9, 32, 18, 9); ctx.fill();
      ctx.shadowBlur = 0; text(it.kind, it.x, it.y + 1, 12, '#111');
    }
    // 패들
    const pc = expandT > 0 ? '#4dd9ff' : '#ff6ad5';
    ctx.shadowColor = pc; ctx.shadowBlur = 18;
    ctx.fillStyle = pc; rr(paddle.x - paddle.w/2, paddle.y - paddle.h/2, paddle.w, paddle.h, 7); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(paddle.x - paddle.w/2 + 8, paddle.y - paddle.h/2 + 3, paddle.w - 16, 3);
    // 공
    const bc = pierceT > 0 ? '#ff6a3d' : '#ffffff';
    for(const b of balls){
      b.trail.forEach((t, i) => { ctx.globalAlpha = (i+1) / b.trail.length * 0.35; ctx.fillStyle = bc; ctx.beginPath(); ctx.arc(t.x, t.y, b.r * (i+1)/b.trail.length, 0, Math.PI*2); ctx.fill(); });
      ctx.globalAlpha = 1;
      ctx.shadowColor = bc; ctx.shadowBlur = 14;
      ctx.fillStyle = bc; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }
    drawParts(parts);
    ctx.restore();

    // HUD
    text(`SCORE ${score}`, 12, 22, 18, '#fff', 'left');
    text(`STAGE ${stage}`, W-12, 22, 18, '#fff', 'right');
    for(let i=0;i<lives;i++){ ctx.fillStyle = '#ff6ad5'; rr(12 + i*30, H - 22, 24, 8, 4); ctx.fill(); }
    let ix = W - 12;
    if(expandT > 0){ text(`확장 ${Math.ceil(expandT/60)}`, ix, H - 18, 13, '#4dd9ff', 'right'); ix -= 70; }
    if(pierceT > 0){ text(`관통 ${Math.ceil(pierceT/60)}`, ix, H - 18, 13, '#ff6a3d', 'right'); }
    if(mode === 'play' && balls.some(b => b.stuck)) text('스페이스 / 클릭으로 발사', W/2, paddle.y + 34, 14, 'rgba(255,255,255,.6)', 'center', 'normal');
    if(bannerT > 0 && mode === 'play'){
      ctx.globalAlpha = Math.min(1, bannerT/30);
      text(bannerText, W/2, H/2 + 60, 40, '#ff6ad5');
      ctx.globalAlpha = 1;
    }
  }

  return {
    name: '네온 브레이커', en: 'NEON BREAKER', color: '#ff6ad5', bestKey: 'breaker_best',
    desc: '블록 깨기 · 공을 튕겨 벽돌을 모두 부숴라!',
    help: ['패들 이동: 마우스 / ←→ / A D / 드래그', '공 발사: 스페이스 또는 클릭·탭', '아이템  E 패들 확장 · M 멀티볼 · T 관통 · L 목숨', '회색·금색 벽돌은 여러 번 맞혀야 깨져요'],
    start(){
      paddle = { x: W/2, y: H - 70, w: 90, h: 14 };
      items = []; parts = []; score = 0; lives = 3; stage = 1; pierceT = 0; expandT = 0; shake = 0; bannerT = 0;
      layout(1); resetBall(); showBanner('STAGE 1');
    },
    update,
    idle(){ parts = stepParts(parts, 0.08); },
    keydown(code){ if(code === 'Space' || code === 'ArrowUp' || code === 'KeyW') launch(); },
    pdown(p){ paddle.x = clamp(p.x, paddle.w/2, W - paddle.w/2); launch(); },
    pmove(p){ paddle.x = clamp(p.x, paddle.w/2, W - paddle.w/2); },
    pup(){},
    draw,
  };
}

// =====================================================================
//  게임 3: 점프 러너 (끝없이 달리기)
// =====================================================================
function makeRunner(){
  const GY = 540;           // 땅 높이
  const PX = 110;           // 캐릭터 x 위치
  let pl, obs, gaps, coins, parts, clouds, speed, dist, coinCount, spawnIn, dead, deadT, holding, scroll, flash;

  function score(){ return Math.floor(dist / 10) + coinCount * 50; }
  function overGap(){ return gaps.some(g => pl.x + 8 > g.x && pl.x + pl.w - 8 < g.x + g.w); }

  function coinRow(x, y, n){ for(let i=0;i<n;i++) coins.push({ x: x + i*34, y, t: Math.random()*6 }); }
  function coinArc(x, w, h){
    for(let i=0;i<5;i++){ const f = i/4; coins.push({ x: x + w*f, y: GY - 40 - Math.sin(f*Math.PI)*h, t: i }); }
  }

  function spawn(){
    const x = W + 40, r = Math.random(), lvl = Math.min(1, dist / 15000);
    if(r < 0.3){
      const n = 1 + Math.floor(Math.random() * (lvl > 0.3 ? 3 : 2));
      obs.push({ type: 'spike', x, y: GY - 26, w: n*24, h: 26 });
      if(Math.random() < .6) coinArc(x - 40, n*24 + 80, 110);
    } else if(r < 0.52){
      const w = rnd(70, 110) + speed * 5;
      gaps.push({ x, w });
      if(Math.random() < .7) coinArc(x - 20, w + 40, 120);
    } else if(r < 0.72){
      const h = rnd(40, 85);
      obs.push({ type: 'block', x, y: GY - h, w: 46, h });
      coinRow(x + 6, GY - h - 30, 2);
      if(lvl > 0.2 && Math.random() < .5) obs.push({ type: 'spike', x: x + 140, y: GY - 26, w: 48, h: 26 });
    } else if(r < 0.88 && dist > 1500){
      const high = Math.random() < .5;
      obs.push({ type: 'bird', x, y: high ? GY - 140 : GY - 66, w: 40, h: 24, vx: 1.5 + lvl*1.5, t: 0 });
      if(high) coinRow(x - 40, GY - 25, 4);
    } else {
      coinRow(x, GY - (Math.random() < .5 ? 30 : 140), 5);
    }
    spawnIn = rnd(260, 420) + speed * 14;
  }

  function die(){
    if(dead) return;
    dead = true; deadT = 60; flash = 12;
    sfx.hurt();
    burst(parts, pl.x + pl.w/2, pl.y + pl.h/2, 40, '#ff9a3d', 6, 45);
  }

  function jump(){
    if(dead) return;
    if(pl.jumps > 0){
      pl.vy = pl.jumps === 2 ? -12.5 : -11;
      pl.jumps--; pl.ground = false;
      sfx.jump();
      if(pl.jumps === 0) burst(parts, pl.x + pl.w/2, pl.y + pl.h, 10, '#ffffff', 2.5, 25);
    }
  }

  function moveBg(spd){
    scroll += spd;
    for(const c of clouds){ c.x -= spd * c.s; if(c.x < -120){ c.x = W + rnd(20, 200); c.y = rnd(60, 260); } }
  }

  function update(){
    if(dead){
      parts = stepParts(parts, 0.15);
      if(flash > 0) flash--;
      if(--deadT <= 0) finish(score(), `거리 ${Math.floor(dist/10)}m · 코인 ${coinCount}개`);
      return;
    }
    speed = Math.min(13, speed + 0.0012);
    dist += speed;
    moveBg(speed);

    for(const o of obs){ o.x -= speed + (o.vx || 0); if(o.type === 'bird') o.t++; }
    for(const g of gaps) g.x -= speed;
    for(const c of coins){ c.x -= speed; c.t += 0.1; }
    obs = obs.filter(o => o.x + o.w > -60);
    gaps = gaps.filter(g => g.x + g.w > -60);
    coins = coins.filter(c => c.x > -30 && !c.got);

    spawnIn -= speed;
    if(spawnIn <= 0) spawn();

    // 물리
    const prevFeet = pl.y + pl.h;
    const g = (holding && pl.vy < 0) ? 0.5 : 0.85;
    pl.vy = Math.min(16, pl.vy + g);
    pl.y += pl.vy;
    const feet = pl.y + pl.h;
    pl.ground = false;

    // 땅
    if(!overGap()){
      if(feet >= GY && prevFeet <= GY + 1){ pl.y = GY - pl.h; pl.vy = 0; pl.ground = true; }
      else if(feet > GY + 4) die();          // 구덩이 벽에 부딪힘
    }
    // 상자(밟을 수 있음) / 가시 / 새
    for(const o of obs){
      const ox = pl.x + 5 < o.x + o.w && pl.x + pl.w - 5 > o.x;
      if(o.type === 'block'){
        if(ox && pl.vy >= 0 && prevFeet <= o.y + 2 && pl.y + pl.h >= o.y){ pl.y = o.y - pl.h; pl.vy = 0; pl.ground = true; }
        else if(ox && pl.y + pl.h > o.y + 6 && pl.y < o.y + o.h) die();
      } else if(o.type === 'spike'){
        if(pl.x + 8 < o.x + o.w - 4 && pl.x + pl.w - 8 > o.x + 4 && pl.y + pl.h > o.y + 10) die();
      } else if(o.type === 'bird'){
        if(pl.x + 6 < o.x + o.w - 6 && pl.x + pl.w - 6 > o.x + 6 && pl.y + 6 < o.y + o.h - 4 && pl.y + pl.h - 4 > o.y + 4) die();
      }
    }
    if(pl.y > H) die();
    if(pl.ground) pl.jumps = 2;
    pl.anim += pl.ground ? speed * 0.05 : 0;

    // 코인
    for(const c of coins){
      if(c.x > pl.x - 12 && c.x < pl.x + pl.w + 12 && c.y > pl.y - 12 && c.y < pl.y + pl.h + 12){
        c.got = true; coinCount++; sfx.coin();
        burst(parts, c.x, c.y, 6, '#ffe066', 2.5, 20);
      }
    }
    parts = stepParts(parts, 0.15);
    if(flash > 0) flash--;
  }

  function drawBg(){
    const sky = ctx.createLinearGradient(0, 0, 0, GY);
    sky.addColorStop(0, '#5fb4ff'); sky.addColorStop(0.7, '#bfe3ff'); sky.addColorStop(1, '#ffe8c2');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, GY);
    // 해
    ctx.fillStyle = 'rgba(255,240,180,.9)'; ctx.beginPath(); ctx.arc(370, 150, 42, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,180,.25)'; ctx.beginPath(); ctx.arc(370, 150, 62, 0, Math.PI*2); ctx.fill();
    // 구름
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for(const c of clouds){
      ctx.beginPath(); ctx.arc(c.x, c.y, 22*c.k, 0, Math.PI*2); ctx.arc(c.x + 24*c.k, c.y - 10*c.k, 26*c.k, 0, Math.PI*2); ctx.arc(c.x + 52*c.k, c.y, 20*c.k, 0, Math.PI*2); ctx.fill();
    }
    // 먼 산, 가까운 언덕 (시차 스크롤)
    const layer = (k, base, amp, col, f1, f2) => {
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, GY);
      for(let x=0;x<=W;x+=8){ const wx = x + scroll*k; ctx.lineTo(x, base - Math.abs(Math.sin(wx*f1))*amp - Math.sin(wx*f2)*amp*.3); }
      ctx.lineTo(W, GY); ctx.closePath(); ctx.fill();
    };
    layer(0.15, GY - 70, 130, '#8fb3d9', 0.006, 0.017);
    layer(0.4,  GY - 20, 70,  '#6fbf73', 0.011, 0.023);
  }

  function drawGround(){
    // 땅 (구덩이 빼고)
    let segs = [[0, W]];
    for(const g of gaps){
      const next = [];
      for(const [a, b] of segs){
        if(g.x + g.w <= a || g.x >= b){ next.push([a, b]); continue; }
        if(g.x > a) next.push([a, g.x]);
        if(g.x + g.w < b) next.push([g.x + g.w, b]);
      }
      segs = next;
    }
    ctx.fillStyle = '#2a1a36'; ctx.fillRect(0, GY, W, H - GY); // 구덩이 속
    for(const [a, b] of segs){
      ctx.fillStyle = '#8a5a34'; ctx.fillRect(a, GY, b - a, H - GY);
      ctx.fillStyle = '#4caf50'; ctx.fillRect(a, GY, b - a, 14);
      ctx.fillStyle = '#7ad46f'; ctx.fillRect(a, GY, b - a, 4);
      ctx.save(); ctx.beginPath(); ctx.rect(a, GY + 14, b - a, H - GY); ctx.clip();
      ctx.fillStyle = '#76492a';
      const off = scroll % 60;
      for(let x=-60;x<W+60;x+=60) for(let y=GY+30;y<H;y+=40) ctx.fillRect(x - off + ((y/40)%2)*30, y, 22, 8);
      ctx.restore();
    }
  }

  function drawPlayer(){
    if(dead) return;
    const x = pl.x, y = pl.y, w = pl.w, h = pl.h;
    const legA = Math.sin(pl.anim * 2) * 8;
    ctx.save();
    // 다리
    ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    if(pl.ground){ ctx.moveTo(x + w*.35, y + h - 8); ctx.lineTo(x + w*.35 + legA, y + h); ctx.moveTo(x + w*.65, y + h - 8); ctx.lineTo(x + w*.65 - legA, y + h); }
    else { ctx.moveTo(x + w*.35, y + h - 8); ctx.lineTo(x + w*.2, y + h - 2); ctx.moveTo(x + w*.65, y + h - 8); ctx.lineTo(x + w*.8, y + h - 4); }
    ctx.stroke();
    // 몸
    ctx.fillStyle = '#ff9a3d'; rr(x, y + 4, w, h - 10, 12); ctx.fill();
    ctx.fillStyle = '#fff2dc'; rr(x + 6, y + 18, w - 12, h - 26, 8); ctx.fill();
    // 귀
    ctx.fillStyle = '#ff9a3d';
    ctx.beginPath(); ctx.moveTo(x + 4, y + 8); ctx.lineTo(x + 8, y - 4); ctx.lineTo(x + 14, y + 6); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + w - 14, y + 6); ctx.lineTo(x + w - 6, y - 4); ctx.lineTo(x + w - 3, y + 8); ctx.fill();
    // 눈
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(x + w - 9, y + 14, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + w - 8, y + 13, 1, 0, Math.PI*2); ctx.fill();
    // 목도리 (펄럭임)
    ctx.fillStyle = '#e53950';
    ctx.fillRect(x + 2, y + 20, w - 4, 5);
    const f = Math.sin(frame * 0.4) * 4;
    ctx.beginPath(); ctx.moveTo(x + 4, y + 21); ctx.lineTo(x - 14, y + 18 + f); ctx.lineTo(x - 12, y + 26 + f); ctx.lineTo(x + 4, y + 25); ctx.fill();
    ctx.restore();
  }

  function drawObs(o){
    if(o.type === 'spike'){
      ctx.fillStyle = '#9aa3b5';
      for(let i=0;i<o.w/24;i++){ const sx = o.x + i*24; ctx.beginPath(); ctx.moveTo(sx, GY); ctx.lineTo(sx + 12, o.y); ctx.lineTo(sx + 24, GY); ctx.fill(); }
      ctx.fillStyle = '#d6dbe6';
      for(let i=0;i<o.w/24;i++){ const sx = o.x + i*24; ctx.beginPath(); ctx.moveTo(sx + 12, o.y); ctx.lineTo(sx + 16, GY); ctx.lineTo(sx + 12, GY); ctx.fill(); }
    } else if(o.type === 'block'){
      ctx.fillStyle = '#c58a4a'; ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.strokeStyle = '#7a4f24'; ctx.lineWidth = 3; ctx.strokeRect(o.x + 1.5, o.y + 1.5, o.w - 3, o.h - 3);
      ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(o.x + o.w, o.y + o.h); ctx.moveTo(o.x + o.w, o.y); ctx.lineTo(o.x, o.y + o.h); ctx.stroke();
    } else if(o.type === 'bird'){
      const flap = Math.sin(o.t * 0.4) * 10;
      ctx.fillStyle = '#4a3a6a';
      ctx.beginPath(); ctx.ellipse(o.x + 20, o.y + 12, 18, 10, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(o.x + 14, o.y + 10); ctx.lineTo(o.x + 24, o.y - 4 - flap); ctx.lineTo(o.x + 30, o.y + 10); ctx.fill();
      ctx.fillStyle = '#ffb84d'; ctx.beginPath(); ctx.moveTo(o.x + 2, o.y + 10); ctx.lineTo(o.x - 8, o.y + 13); ctx.lineTo(o.x + 4, o.y + 15); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(o.x + 10, o.y + 9, 3, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(o.x + 9, o.y + 9, 1.5, 0, Math.PI*2); ctx.fill();
    }
  }

  function draw(){
    drawBg();
    drawGround();
    for(const o of obs) drawObs(o);
    for(const c of coins){
      const sx = Math.abs(Math.cos(c.t));
      ctx.fillStyle = '#ffd23d'; ctx.beginPath(); ctx.ellipse(c.x, c.y, 9*sx + 1, 10, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff3a8'; ctx.beginPath(); ctx.ellipse(c.x, c.y, 4*sx, 6, 0, 0, Math.PI*2); ctx.fill();
    }
    drawPlayer();
    drawParts(parts);
    if(flash > 0){ ctx.fillStyle = `rgba(255,255,255,${flash/20})`; ctx.fillRect(0,0,W,H); }
    // HUD
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(0, 0, W, 48);
    text(`SCORE ${score()}`, 12, 24, 18, '#fff', 'left');
    text(`${Math.floor(dist/10)} m`, W - 12, 24, 18, '#fff', 'right');
    ctx.fillStyle = '#ffd23d'; ctx.beginPath(); ctx.arc(22, 70, 8, 0, Math.PI*2); ctx.fill();
    text(`× ${coinCount}`, 36, 71, 16, '#4a3000', 'left');
    if(mode === 'play' && dist < 600) text('스페이스 / 탭 = 점프 (길게 누르면 높이, 공중에서 한 번 더!)', W/2, GY + 80, 13, '#fff', 'center', 'normal');
  }

  return {
    name: '점프 러너', en: 'JUMP RUNNER', color: '#ffb84d', bestKey: 'runner_best',
    desc: '달리기 · 가시와 구덩이를 넘어 끝까지!',
    help: ['점프: 스페이스 / ↑ / W / 탭', '길게 누르면 더 높이, 공중에서 한 번 더 점프', '상자는 밟을 수 있어요 · 높이 나는 새는 그냥 지나가요', '코인 1개 = 50점, 달린 거리 10m = 1점'],
    start(){
      pl = { x: PX, y: GY - 44, w: 32, h: 44, vy: 0, ground: true, jumps: 2, anim: 0 };
      obs = []; gaps = []; coins = []; parts = [];
      clouds = []; for(let i=0;i<5;i++) clouds.push({ x: rnd(0, W), y: rnd(60, 260), k: rnd(.6, 1.2), s: rnd(.1, .25) });
      speed = 5.5; dist = 0; coinCount = 0; spawnIn = 300; dead = false; deadT = 0; holding = false; scroll = 0; flash = 0;
    },
    update,
    idle(){ if(!dead) moveBg(1.5); pl.anim += 0.08; parts = stepParts(parts, 0.15); },
    keydown(code){ if(code === 'Space' || code === 'ArrowUp' || code === 'KeyW'){ holding = true; jump(); } },
    keyup(code){ if(code === 'Space' || code === 'ArrowUp' || code === 'KeyW') holding = false; },
    pdown(){ holding = true; jump(); },
    pmove(){},
    pup(n){ if(n === 0) holding = false; },
    draw,
  };
}

// =====================================================================
//  메뉴 / 화면 전환
// =====================================================================
const GAMES = [makeShooter(), makeBreaker(), makeRunner()];
let mode = 'menu';      // menu | title | play | pause | over
let game = null, sel = 0;

const menuStars = [];
for(let i=0;i<90;i++) menuStars.push({ x: Math.random()*W, y: Math.random()*H, z: Math.random()*2+0.4 });
const CARD = i => ({ x: 36, y: 190 + i*162, w: W - 72, h: 140 });
const MENU_BTN = { x: W/2 - 80, y: H - 120, w: 160, h: 44 };
const RESUME_BTN = { x: W/2 - 80, y: H/2 + 20, w: 160, h: 44 };
const PAUSE_BTN = { x: W/2 - 22, y: 6, w: 44, h: 32 };

function enterGame(i){ sel = i; game = GAMES[i]; game.start(); mode = 'title'; sfx.select(); }
function startGame(){ game.start(); mode = 'play'; }
function toMenu(){ mode = 'menu'; game = null; for(const k in keys) keys[k] = false; }

function drawIcon(i, cx, cy){
  ctx.save(); ctx.translate(cx, cy);
  if(i === 0){
    ctx.scale(1.4, 1.4); drawPlane();
    ctx.fillStyle = '#ffe066'; ctx.fillRect(-2, -40, 4, 10);
  } else if(i === 1){
    const cols = ['#ff5a5a','#ffb84d','#5aff7a','#4dd9ff'];
    for(let r=0;r<2;r++) for(let c=0;c<4;c++){ ctx.fillStyle = cols[(r+c)%4]; rr(-38 + c*19, -34 + r*12, 17, 10, 2); ctx.fill(); }
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(8, 4, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff6ad5'; rr(-24, 24, 48, 9, 4); ctx.fill();
  } else {
    ctx.fillStyle = '#4caf50'; ctx.fillRect(-44, 26, 88, 8);
    ctx.fillStyle = '#9aa3b5'; ctx.beginPath(); ctx.moveTo(14, 26); ctx.lineTo(24, 8); ctx.lineTo(34, 26); ctx.fill();
    ctx.fillStyle = '#ff9a3d'; rr(-26, -12, 26, 30, 9); ctx.fill();
    ctx.fillStyle = '#fff2dc'; rr(-21, -1, 16, 14, 5); ctx.fill();
    ctx.fillStyle = '#e53950'; ctx.fillRect(-26, 1, 26, 4);
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(-7, -3, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffd23d'; ctx.beginPath(); ctx.arc(24, -18, 6, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawMenu(){
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0, '#0b0a24'); bg.addColorStop(1, '#14082a');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  for(const s of menuStars){ ctx.fillStyle = `rgba(220,210,255,${s.z/2.5})`; ctx.fillRect(s.x, s.y, s.z, s.z); }
  ctx.shadowColor = '#b37cff'; ctx.shadowBlur = 20;
  text('MINI ARCADE', W/2, 92, 46, '#fff');
  ctx.shadowBlur = 0;
  text('하고 싶은 게임을 골라 주세요', W/2, 140, 16, '#b8b0d8', 'center', 'normal');
  GAMES.forEach((g, i) => {
    const c = CARD(i), on = i === sel;
    ctx.fillStyle = on ? 'rgba(255,255,255,.10)' : 'rgba(255,255,255,.04)';
    rr(c.x, c.y, c.w, c.h, 16); ctx.fill();
    ctx.lineWidth = on ? 3 : 1.5; ctx.strokeStyle = on ? g.color : 'rgba(255,255,255,.15)';
    if(on){ ctx.shadowColor = g.color; ctx.shadowBlur = 16; }
    rr(c.x, c.y, c.w, c.h, 16); ctx.stroke(); ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(0,0,0,.3)'; rr(c.x + 14, c.y + 14, 110, c.h - 28, 12); ctx.fill();
    drawIcon(i, c.x + 69, c.y + c.h/2);
    text(g.name, c.x + 142, c.y + 40, 24, g.color, 'left');
    text(g.desc, c.x + 142, c.y + 74, 13, '#d4d0ea', 'left', 'normal');
    const best = +(store(g.bestKey) || 0);
    text(best ? `최고 점수 ${best}` : '아직 기록 없음', c.x + 142, c.y + 106, 13, '#8f88b3', 'left', 'normal');
  });
  text('↑↓ 선택 · Enter 시작 · 클릭/탭으로 바로 선택', W/2, H - 34, 13, '#7a7299', 'center', 'normal');
}

function button(r, label, color){
  ctx.fillStyle = 'rgba(255,255,255,.08)'; rr(r.x, r.y, r.w, r.h, 12); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 2; rr(r.x, r.y, r.w, r.h, 12); ctx.stroke();
  text(label, r.x + r.w/2, r.y + r.h/2 + 1, 16, color);
}

function drawScreen(){
  ctx.fillStyle = 'rgba(3,4,14,.74)'; ctx.fillRect(0,0,W,H);
  const g = game, blink = Math.floor(performance.now() / 550) % 2 === 0;
  if(mode === 'title'){
    ctx.shadowColor = g.color; ctx.shadowBlur = 18;
    text(g.en, W/2, 170, 42, g.color); ctx.shadowBlur = 0;
    text(g.name, W/2, 218, 20, '#fff');
    g.help.forEach((l, i) => text(l, W/2, 290 + i*32, 15, '#d0d8ee', 'center', 'normal'));
    const best = +(store(g.bestKey) || 0);
    if(best) text(`최고 점수 ${best}`, W/2, 440, 16, '#ffe066');
    if(blink) text('Enter 또는 화면 터치로 시작', W/2, 500, 20, '#ffe066');
    button(MENU_BTN, '◀ 메뉴로 (ESC)', '#b8b0d8');
  } else if(mode === 'over'){
    text('GAME OVER', W/2, 200, 46, '#ff5a7a');
    text(`점수 ${lastScore}`, W/2, 275, 28, '#fff');
    if(lastExtra) text(lastExtra, W/2, 315, 16, '#d0d8ee', 'center', 'normal');
    const best = +(store(g.bestKey) || 0);
    text(lastScore >= best && lastScore > 0 ? '★ 새 최고 기록! ★' : `최고 점수 ${best}`, W/2, 355, 18, '#ffe066');
    if(blink) text('Enter 또는 화면 터치로 다시 시작', W/2, 470, 20, '#ffe066');
    button(MENU_BTN, '◀ 메뉴로 (ESC)', '#b8b0d8');
  } else if(mode === 'pause'){
    text('일시정지', W/2, H/2 - 60, 38, '#fff');
    button(RESUME_BTN, '▶ 계속 (P)', g.color);
    button(MENU_BTN, '◀ 메뉴로 (ESC)', '#b8b0d8');
  }
}

function drawPauseBtn(){
  ctx.fillStyle = 'rgba(0,0,0,.35)'; rr(PAUSE_BTN.x, PAUSE_BTN.y, PAUSE_BTN.w, PAUSE_BTN.h, 8); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  ctx.fillRect(PAUSE_BTN.x + 15, PAUSE_BTN.y + 9, 5, 14); ctx.fillRect(PAUSE_BTN.x + 24, PAUSE_BTN.y + 9, 5, 14);
}

// =====================================================================
//  입력
// =====================================================================
addEventListener('keydown', e => {
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(e.repeat){ keys[e.code] = true; return; }
  keys[e.code] = true;
  unlockAudio();
  if(e.code === 'Escape'){ if(mode !== 'menu') toMenu(); return; }
  if(mode === 'menu'){
    if(e.code === 'ArrowUp' || e.code === 'KeyW'){ sel = (sel + GAMES.length - 1) % GAMES.length; sfx.select(); }
    if(e.code === 'ArrowDown' || e.code === 'KeyS'){ sel = (sel + 1) % GAMES.length; sfx.select(); }
    if(e.code === 'Enter' || e.code === 'Space') enterGame(sel);
  } else if(mode === 'title' || mode === 'over'){
    if(e.code === 'Enter') startGame();
  } else if(mode === 'play'){
    if(e.code === 'KeyP') mode = 'pause';
    else game.keydown(e.code);
  } else if(mode === 'pause'){
    if(e.code === 'KeyP' || e.code === 'Enter') mode = 'play';
  }
});
addEventListener('keyup', e => {
  keys[e.code] = false;
  if(mode === 'play' && game.keyup) game.keyup(e.code);
});

const pointers = new Set();
function toCanvas(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
addEventListener('pointerdown', e => {
  unlockAudio();
  pointers.add(e.pointerId);
  const p = toCanvas(e);
  if(mode === 'menu'){
    GAMES.forEach((g, i) => { if(inRect(p, CARD(i))) enterGame(i); });
  } else if(mode === 'title' || mode === 'over'){
    if(inRect(p, MENU_BTN)) toMenu(); else startGame();
  } else if(mode === 'pause'){
    if(inRect(p, MENU_BTN)) toMenu(); else mode = 'play';
  } else if(mode === 'play'){
    if(inRect(p, PAUSE_BTN)) mode = 'pause';
    else game.pdown(p, pointers.size);
  }
});
addEventListener('pointermove', e => {
  const p = toCanvas(e);
  if(mode === 'play') game.pmove(p);
  else if(mode === 'menu' && e.pointerType === 'mouse') GAMES.forEach((g, i) => { if(inRect(p, CARD(i))) sel = i; });
});
function pEnd(e){ pointers.delete(e.pointerId); if(mode === 'play') game.pup(pointers.size); }
addEventListener('pointerup', pEnd);
addEventListener('pointercancel', pEnd);
addEventListener('blur', () => { for(const k in keys) keys[k] = false; if(mode === 'play') mode = 'pause'; });

// =====================================================================
//  메인 루프 (60fps 고정 스텝)
// =====================================================================
let last = performance.now(), acc = 0;
function loop(now){
  acc += Math.min(100, now - last); last = now;
  while(acc >= 1000/60){
    frame++;
    if(mode === 'menu'){ for(const s of menuStars){ s.y += s.z * .5; if(s.y > H){ s.y = 0; s.x = Math.random()*W; } } }
    else if(mode === 'play') game.update();
    else if(mode !== 'pause' && game.idle) game.idle();
    acc -= 1000/60;
  }
  if(mode === 'menu') drawMenu();
  else {
    game.draw();
    if(mode === 'play') drawPauseBtn();
    else drawScreen();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// 테스트용 훅
window.__arcade = { get mode(){ return mode; }, get game(){ return game && game.name; }, enterGame, startGame, toMenu };
})();
</script>
</body>
